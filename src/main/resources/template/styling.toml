version = "1.1.0"

[global]
resolution = "2048x858"
fps = "24"
timecodeFormat = "SMPTE_NON_DROP_FRAME"
blankFirstFrame = false
blankLastFrame = true
grounding = [0.0, 0.0, 0.0, 1.0, ]
unitVGapPx = 32.0
locale = "en"
uppercaseExceptions = ["_af_", "_auf_", "_d’#", "_da_", "_Da#", "_dai_", "_Dai#", "_dal_", "_Dal#", "_dalla_", "_Dalla#", "_das_", "_de_", "_de’_", "_dei_", "_Dei#", "_del_", "_Del#", "_della_", "_Della#", "_der_", "_des_", "_di_", "_Di#", "_do_", "_dos_", "_du_", "_e_", "_Mc#", "_Mac#", "_of_", "_ten_", "_thoe_", "_til_", "_to_", "_tot_", "_van_", "_von_", "_von und zu_", "_zu_", ]

[[pageStyle]]
